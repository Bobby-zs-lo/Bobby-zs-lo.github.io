name: Update site content

on:
  schedule:
    - cron: '0 2 * * *'   # daily at 02:00 UTC (after Gemini quota resets)
  workflow_dispatch:
    inputs:
      max_new:
        description: "Cap how many new papers to enrich this run (blank = unlimited)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v5
        with:
          fetch-depth: 0   # full history so the rebase-on-reject retry works

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        run: python -m pytest tests/ -q

      - name: Generate publications + cache
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          if [ -n "${{ inputs.max_new }}" ]; then
            python generate_publications.py --max-new ${{ inputs.max_new }}
          else
            python generate_publications.py
          fi

      - name: Render index.html research + outreach
        run: python generate_index.py

      - name: Commit changes
        run: |
          set -euo pipefail
          git config user.name  "GitHub Actions Bot"
          git config user.email "actions@github.com"

          git add -- publications.html publications.xml index.html data/abstract_cache.json
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "Automated update: publications + cache + index"

          # main can be rewritten while this job runs; rebase onto the current
          # tip and retry instead of failing on a non-fast-forward push.
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then
              echo "Pushed on attempt $attempt."
              exit 0
            fi
            echo "Push rejected (attempt $attempt); rebasing onto origin/main."
            git fetch origin main
            git rebase origin/main
          done
          echo "Could not push after 3 attempts." >&2
          exit 1
