<!DOCTYPE html>
<html lang="da">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Legegruppe — planen</title>
<link rel="stylesheet" href="../css/legegruppe.css">
</head>
<body>

<nav class="nav lg-noprint">
  <div class="container nav-inner">
    <a href="/" class="nav-brand">Bobby<span class="nav-brand-dot">.</span>Lo</a>
    <ul class="nav-links">
      <li><a href="/legegruppe/plan/" class="active" aria-current="page">Legegruppe</a></li>
    </ul>
  </div>
</nav>

<main class="lg-main lg-plan-main">

  <header class="lg-header">
    <div class="eyebrow" id="lg-eyebrow">Legegrupper</div>
    <h1 id="lg-title">Planen</h1>
  </header>

  <div id="lg-status" class="lg-status" role="status" aria-live="polite" hidden></div>

  <div id="lg-content"></div>

</main>

<script src="../js/api.js"></script>
<script src="../js/ui/plan.js"></script>
<script>
(function () {
  'use strict';
  var Plan = window.LG.Plan;
  var api = window.LG.Api.createClient({});

  var statusEl = document.getElementById('lg-status');
  var content = document.getElementById('lg-content');
  var token = new URLSearchParams(location.search).get('f') || '';

  function show(kind, text) {
    statusEl.className = 'lg-status' + (kind ? ' lg-status--' + kind : '');
    statusEl.textContent = text;
    statusEl.hidden = false;
  }
  function el(tag, className, text) {
    var n = document.createElement(tag);
    if (className) n.className = className;
    if (text != null) n.textContent = text;
    return n;
  }
  function section(title, note) {
    var s = el('section', 'lg-section');
    s.appendChild(el('h2', null, title));
    if (note) s.appendChild(el('p', 'lg-section-note', note));
    return s;
  }

  if (!token) {
    show('error', 'Du mangler dit personlige link. Bed administratoren om at sende det igen.');
    return;
  }

  /** "om 3 dage", "i morgen", "i dag" — a date alone does not tell you how soon. */
  function countdown(date) {
    var today = new Date();
    var days = Math.round((date.getTime() -
      Date.UTC(today.getFullYear(), today.getMonth(), today.getDate())) / 86400000);
    if (days <= 0) return 'i dag';
    if (days === 1) return 'i morgen';
    if (days < 7) return 'om ' + days + ' dage';
    if (days < 14) return 'om en uge';
    return 'om ' + Math.round(days / 7) + ' uger';
  }

  /** The whole point of the page: what is happening next, at size. */
  function nextCard(ctx, familyId) {
    var next = Plan.nextMeeting(ctx, familyId);
    if (!next) {
      var done = el('div', 'lg-next');
      done.appendChild(el('span', 'lg-next-eyebrow', 'Runden er slut'));
      done.appendChild(el('p', 'lg-next-when', 'Ikke flere møder'));
      done.appendChild(el('p', 'lg-next-transport',
        'Der kommer nye grupper når næste runde lægges.'));
      return done;
    }

    var card = el('div', 'lg-next' + (next.isMine ? ' lg-next--mine' : ''));
    card.appendChild(el('span', 'lg-next-eyebrow',
      next.isMine ? 'Næste gang — og det er jeres tur' : 'Næste gang'));
    card.appendChild(el('p', 'lg-next-when',
      next.weekday.charAt(0).toUpperCase() + next.weekday.slice(1) + ' ' + next.dateText));
    card.appendChild(el('span', 'lg-next-week', 'Uge ' + next.week));

    var where = el('p', 'lg-next-where');
    if (next.outdoors) {
      where.appendChild(document.createTextNode('Ude — legeplads eller park, med '));
      where.appendChild(el('strong', null, next.hostName));
    } else {
      where.appendChild(document.createTextNode('Hjemme hos '));
      where.appendChild(el('strong', null, next.hostName));
    }
    card.appendChild(where);
    card.appendChild(el('p', 'lg-next-transport', next.transport));
    card.appendChild(el('span', 'lg-next-countdown', countdown(next.date)));
    return card;
  }

  function timeline(ctx, familyId) {
    var list = el('ul', 'lg-timeline');
    Plan.myMeetings(ctx, familyId).forEach(function (m) {
      var li = el('li', 'lg-tl' +
        (m.isPast ? ' lg-tl--past' : '') + (m.isMine ? ' lg-tl--mine' : ''));

      var when = el('div', 'lg-tl-date');
      var parts = m.dateText.split('. ');
      when.appendChild(el('span', 'lg-tl-day', parts[0]));
      when.appendChild(el('span', 'lg-tl-month', parts[1]));
      when.appendChild(el('span', 'lg-tl-week', 'uge ' + m.week));
      li.appendChild(when);

      var body = el('div', 'lg-tl-body');
      var what = el('p', 'lg-tl-what');
      what.appendChild(document.createTextNode(
        m.weekday.charAt(0).toUpperCase() + m.weekday.slice(1) + ' — '));
      what.appendChild(document.createTextNode(m.outdoors ? 'ude med ' : 'hjemme hos '));
      what.appendChild(el('strong', null, m.hostName));
      body.appendChild(what);
      body.appendChild(el('span', 'lg-tl-transport', m.transport));

      if (m.isMine || m.needsAgreement) {
        var tags = el('div', 'lg-tl-tags');
        if (m.isMine) tags.appendChild(el('span', 'lg-badge lg-badge--mine', 'jeres tur'));
        if (m.needsAgreement) {
          tags.appendChild(el('span', 'lg-badge lg-badge--aftales', 'transport aftales'));
        }
        body.appendChild(tags);
      }
      li.appendChild(body);
      list.appendChild(li);
    });
    return list;
  }

  function people(ctx, group, familyId) {
    var list = el('ul', 'lg-people');
    var index = new Map(ctx.children.map(function (c) { return [c.childId, c]; }));
    var seen = {};
    group.childIds.forEach(function (id) {
      var child = index.get(id) || {};
      if (!child.familyId || seen[child.familyId]) return;
      seen[child.familyId] = true;
      var info = (ctx.contacts || {})[child.familyId] || {};

      var li = el('li', 'lg-person');
      var who = el('span', 'lg-person-who');
      who.appendChild(document.createTextNode(info.parentName || 'Forælder'));
      who.appendChild(el('span', 'lg-person-child', '  ·  ' + (child.name || '')));
      li.appendChild(who);

      if (child.familyId === familyId) {
        li.appendChild(el('span', 'lg-person-quiet', 'det er jer'));
      } else if (info.contact) {
        var a = el('a', null, info.contact);
        a.href = /@/.test(info.contact)
          ? 'mailto:' + info.contact
          : 'tel:' + String(info.contact).replace(/\s/g, '');
        li.appendChild(a);
      } else {
        li.appendChild(el('span', 'lg-person-quiet', 'ingen kontakt oplyst'));
      }
      list.appendChild(li);
    });
    return list;
  }

  function otherGroups(ctx, myGroup) {
    var wrap = el('details', 'lg-others');
    var count = ctx.round.groups.length - (myGroup ? 1 : 0);
    wrap.appendChild(el('summary', null,
      'De andre ' + count + ' grupper i klassen'));
    ctx.round.groups.forEach(function (g) {
      if (g === myGroup) return;
      var box = el('div', 'lg-other-group');
      box.appendChild(el('h3', null, 'Gruppe ' + g.id));
      box.appendChild(el('p', 'lg-other-kids', Plan.childNames(ctx, g.childIds).join(', ')));
      var rota = Plan.rotaFor(ctx, g.id);
      if (rota && rota.meetings.length) {
        box.appendChild(el('span', 'lg-other-meta',
          rota.meetings.length + ' møder · uge ' + rota.meetings[0].week + '–' +
          rota.meetings[rota.meetings.length - 1].week));
      }
      wrap.appendChild(box);
    });
    return wrap;
  }

  // ── load ───────────────────────────────────────────────────────────
  api.getPlan(token).then(function (data) {
    var ctx = { round: data.round, children: data.children || [],
                contacts: data.contacts || {} };

    if (!ctx.round || !ctx.round.groups || !ctx.round.groups.length) {
      var wait = el('div', 'lg-waiting');
      wait.appendChild(el('h2', null, 'Grupperne er ikke lavet endnu'));
      wait.appendChild(el('p', null,
        'Så snart legegrupperne er sat, dukker jeres op her — på det samme link. ' +
        'Du behøver ikke gøre noget.'));
      var edit = el('a', 'btn btn-outline', 'Ret jeres svar imens');
      edit.href = '../?f=' + encodeURIComponent(token);
      edit.style.marginTop = '22px';
      wait.appendChild(edit);
      content.appendChild(wait);
      return;
    }

    var myGroup = Plan.groupForFamily(ctx, data.familyId);

    if (!myGroup) {
      show('error', 'Vi kunne ikke finde jeres barn i denne runde. ' +
        'Sig til administratoren, så kigger vi på det.');
      content.appendChild(otherGroups(ctx, null));
      return;
    }

    var myKids = ctx.children.filter(function (c) { return c.familyId === data.familyId; })
      .map(function (c) { return c.name; });
    document.getElementById('lg-eyebrow').textContent =
      'Gruppe ' + myGroup.id + (myKids.length ? ' · ' + myKids.join(' og ') : '');
    document.getElementById('lg-title').textContent = 'Jeres legegruppe';

    content.appendChild(nextCard(ctx, data.familyId));

    var duty = Plan.hostingSummary(ctx, data.familyId);
    content.appendChild(el('p',
      'lg-duty' + (/ikke sat på/.test(duty) ? ' lg-duty--none' : ''), duty));

    var groupSection = section('Børnene i gruppen');
    var roster = el('div', 'lg-roster');
    var index = new Map(ctx.children.map(function (c) { return [c.childId, c]; }));
    myGroup.childIds.forEach(function (id) {
      var child = index.get(id) || {};
      roster.appendChild(el('span',
        'lg-kid' + (child.familyId === data.familyId ? ' lg-kid--mine' : ''),
        child.name || id));
    });
    groupSection.appendChild(roster);
    content.appendChild(groupSection);

    var when = section('Hele runden',
      'Møderne er markeret med jeres egne værtsuger. Er transporten ikke på plads, ' +
      'aftaler I den indbyrdes — eller mødes på skolens legeplads.');
    when.appendChild(timeline(ctx, data.familyId));
    content.appendChild(when);

    var contactSection = section('Forældrene i gruppen',
      'Kontaktoplysninger deles kun med de familier I er sat sammen med.');
    contactSection.appendChild(people(ctx, myGroup, data.familyId));
    content.appendChild(contactSection);

    if (ctx.round.groups.length > 1) {
      var others = section('Resten af klassen');
      others.appendChild(otherGroups(ctx, myGroup));
      content.appendChild(others);
    }

    var actions = el('div', 'lg-plan-actions lg-noprint');
    var printBtn = el('button', 'btn btn-outline', 'Print');
    printBtn.type = 'button';
    printBtn.addEventListener('click', function () { window.print(); });
    actions.appendChild(printBtn);

    var copyBtn = el('button', 'btn btn-outline', 'Kopiér som tekst');
    copyBtn.type = 'button';
    copyBtn.addEventListener('click', function () {
      navigator.clipboard.writeText(Plan.toPlainText(ctx)).then(function () {
        show('ok', 'Hele planen er kopieret som tekst. Sæt den ind i Aula.');
      }).catch(function () {
        show('error', 'Kunne ikke kopiere automatisk. Brug Print i stedet.');
      });
    });
    actions.appendChild(copyBtn);

    var editLink = el('a', 'btn btn-outline', 'Ret jeres svar');
    editLink.href = '../?f=' + encodeURIComponent(token);
    actions.appendChild(editLink);
    content.appendChild(actions);
  }).catch(function (err) {
    show('error', err.message);
  });
})();
</script>

</body>
</html>
