<!DOCTYPE html>
<html lang="da">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Legegruppe — planen</title>
<link rel="stylesheet" href="../css/legegruppe.css">
</head>
<body>

<nav class="nav lg-noprint">
  <div class="container nav-inner">
    <a href="/" class="nav-brand">Bobby<span class="nav-brand-dot">.</span>Lo</a>
    <ul class="nav-links">
      <li><a href="/legegruppe/plan/" class="active" aria-current="page">Legegruppe</a></li>
    </ul>
  </div>
</nav>

<main class="lg-main lg-main--wide">

  <header class="lg-header">
    <div class="eyebrow">Legegrupper</div>
    <h1 id="lg-title">Planen</h1>
    <p class="lg-lede" id="lg-lede"></p>
  </header>

  <div id="lg-status" class="lg-status" role="status" aria-live="polite" hidden></div>

  <section id="lg-mine" hidden>
    <h2>Din gruppe</h2>
    <div id="lg-mine-card"></div>
  </section>

  <section id="lg-all" hidden style="margin-top:44px">
    <details class="lg-details">
      <summary>Hele klassens plan</summary>
      <div class="lg-groups" id="lg-all-groups" style="margin-top:20px"></div>
    </details>
  </section>

  <div class="lg-actions lg-noprint" id="lg-tools" hidden>
    <button type="button" class="btn btn-outline" id="lg-print">Print</button>
    <button type="button" class="btn btn-outline" id="lg-copy">Kopiér som tekst</button>
    <a class="btn btn-outline" id="lg-edit" href="#">Ret mine svar</a>
  </div>

</main>

<script src="../js/api.js"></script>
<script src="../js/ui/plan.js"></script>
<script>
(function () {
  'use strict';
  var Plan = window.LG.Plan;
  var api = window.LG.Api.createClient({});

  var statusEl = document.getElementById('lg-status');
  var token = new URLSearchParams(location.search).get('f') || '';

  function show(kind, text) {
    statusEl.className = 'lg-status' + (kind ? ' lg-status--' + kind : '');
    statusEl.textContent = text;
    statusEl.hidden = false;
  }

  function el(tag, className, text) {
    var node = document.createElement(tag);
    if (className) node.className = className;
    if (text != null) node.textContent = text;
    return node;
  }

  if (!token) {
    show('error', 'Du mangler dit personlige link. Bed administratoren om at sende det igen.');
    return;
  }
  document.getElementById('lg-edit').href = '../?f=' + encodeURIComponent(token);

  /** One group as a card. `mine` highlights the reader's own child and weeks. */
  function groupCard(ctx, group, myFamilyId) {
    var card = el('article', 'lg-group' + (myFamilyId ? ' lg-group--mine' : ''));
    card.appendChild(el('div', 'lg-group-tag', 'Gruppe ' + group.id));
    card.appendChild(el('h3', null, Plan.childNames(ctx, group.childIds).join(', ')));

    var kids = el('div', 'lg-kids');
    var index = new Map(ctx.children.map(function (c) { return [c.childId, c]; }));
    group.childIds.forEach(function (id) {
      var child = index.get(id) || {};
      var isMine = myFamilyId && child.familyId === myFamilyId;
      kids.appendChild(el('span', 'lg-kid' + (isMine ? ' lg-kid--mine' : ''),
        child.name || id));
    });
    card.appendChild(kids);

    var rota = Plan.rotaFor(ctx, group.id);
    if (rota && rota.meetings.length) {
      var list = el('ul', 'lg-weeks');
      rota.meetings.forEach(function (m) {
        var d = Plan.describeMeeting(ctx, m);
        var isMine = myFamilyId && m.hostFamilyId === myFamilyId;
        var row = el('li', 'lg-week' + (isMine ? ' lg-week--mine' : ''));
        row.appendChild(el('span', 'lg-week-no', 'Uge ' + d.week));

        var what = el('span', 'lg-week-what');
        what.appendChild(document.createTextNode(
          d.when.replace('Uge ' + d.week + ', ', '') + ' — ' + d.host));
        if (isMine) what.appendChild(el('span', 'lg-badge lg-badge--mine', 'jeres tur'));
        if (d.needsAgreement) {
          what.appendChild(el('span', 'lg-badge lg-badge--aftales', 'aftales'));
        }
        what.appendChild(el('span', 'lg-week-transport', d.transport));
        row.appendChild(what);
        list.appendChild(row);
      });
      card.appendChild(list);
    } else {
      card.appendChild(el('p', 'lg-why', 'Der er endnu ingen møder lagt ind for denne gruppe.'));
    }
    return card;
  }

  function contactList(ctx, group, myFamilyId) {
    var wrap = el('div');
    wrap.appendChild(el('h3', null, 'Forældrene i gruppen'));
    var list = el('ul', 'lg-contacts');
    var seen = {};
    var index = new Map(ctx.children.map(function (c) { return [c.childId, c]; }));
    group.childIds.forEach(function (id) {
      var child = index.get(id) || {};
      if (!child.familyId || seen[child.familyId]) return;
      seen[child.familyId] = true;
      var info = (ctx.contacts || {})[child.familyId] || {};
      var li = el('li');
      li.appendChild(document.createTextNode(
        (info.parentName || 'Forælder') + ' (' + (child.name || '') + ')'));
      if (info.contact) {
        li.appendChild(document.createTextNode(' — '));
        var href = /@/.test(info.contact)
          ? 'mailto:' + info.contact
          : 'tel:' + String(info.contact).replace(/\s/g, '');
        var a = el('a', null, info.contact);
        a.href = href;
        li.appendChild(a);
      }
      list.appendChild(li);
    });
    wrap.appendChild(list);
    return wrap;
  }

  api.getPlan(token).then(function (data) {
    var ctx = { round: data.round, children: data.children || [], contacts: data.contacts || {} };

    if (!ctx.round || !ctx.round.groups || !ctx.round.groups.length) {
      document.getElementById('lg-lede').textContent = Plan.NO_PLAN +
        ' Du får besked når grupperne er lavet.';
      return;
    }

    var myGroup = Plan.groupForFamily(ctx, data.familyId);
    var mine = document.getElementById('lg-mine');
    var mineCard = document.getElementById('lg-mine-card');

    if (myGroup) {
      mineCard.appendChild(groupCard(ctx, myGroup, data.familyId));
      mineCard.appendChild(contactList(ctx, myGroup, data.familyId));
      mine.hidden = false;

      var weeks = Plan.myHostWeeks(ctx, data.familyId);
      document.getElementById('lg-lede').textContent = weeks.length
        ? 'I lægger hus til i uge ' + weeks.join(' og ') + '.'
        : 'I er ikke sat på som vært denne gang.';
    } else {
      document.getElementById('lg-lede').textContent =
        'Vi kunne ikke finde jeres barn i denne runde. Sig til, så kigger vi på det.';
    }

    var all = document.getElementById('lg-all-groups');
    ctx.round.groups.forEach(function (g) {
      all.appendChild(groupCard(ctx, g, g === myGroup ? data.familyId : null));
    });
    document.getElementById('lg-all').hidden = false;
    document.getElementById('lg-tools').hidden = false;

    document.getElementById('lg-print').addEventListener('click', function () {
      window.print();
    });
    document.getElementById('lg-copy').addEventListener('click', function () {
      navigator.clipboard.writeText(Plan.toPlainText(ctx)).then(function () {
        show('ok', 'Planen er kopieret som tekst. Sæt den ind i Aula.');
      }).catch(function () {
        show('error', 'Kunne ikke kopiere automatisk. Brug Print i stedet.');
      });
    });
  }).catch(function (err) {
    show('error', err.message);
  });
})();
</script>

</body>
</html>
