<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex,nofollow">
  <meta name="referrer" content="no-referrer">
  <title>Running</title>
  <meta name="description" content="Private training app.">
  <meta name="theme-color" content="#FBFAF7" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#151210" media="(prefers-color-scheme: dark)">
  <meta name="color-scheme" content="light dark">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Running">
  <meta name="application-name" content="Running">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" sizes="192x192" href="assets/icon-192.png">
  <link rel="apple-touch-icon" href="assets/icon-192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap">
  <link rel="stylesheet" href="css/running.css">
  <link rel="stylesheet" href="css/desk.css">
  <link rel="stylesheet" href="css/map.css">
  <link rel="stylesheet" href="css/routes.css">
</head>
<body>
  <div id="app"></div>
  <noscript><p style="padding:16px">This app needs JavaScript.</p></noscript>
  <script type="module" src="js/app.js"></script>
  <script>
    // Module service worker (Chrome 91+): sw.js imports API_BASE from js/config.js.
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function () {
        navigator.serviceWorker.register('./sw.js', { type: 'module', scope: './' })
          .catch(function (err) { console.warn('Service worker registration failed', err); });
      });
    }
  </script>
</body>
</html>
